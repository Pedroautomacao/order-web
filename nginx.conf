server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    # text/html o nginx já comprime sozinho quando gzip está on. O .js aparece
    # nas duas grafias porque o mime.types mudou entre versões do nginx.
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # Os assets do CRA levam hash no nome, então um deploy novo gera nomes
    # novos: podem ser cacheados indefinidamente. Um Cache-Control único em vez
    # de `expires` + `add_header`, que emitiriam o header duas vezes.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O index.html nunca em cache: é ele que aponta para os bundles novos
    # depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # O React Router usa a history API: /login, /admin, /admin/orders,
    # /admin/products etc. não existem como arquivo no disco. Sem este
    # fallback, um F5 direto nessas telas devolveria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
